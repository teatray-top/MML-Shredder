[package]
name = "mmlfold"
version = "0.1.0"
license = "MIT"
edition = "2024"
description = "MIDI and MMI arrangement for desktop and browser"
default-run = "mmlfold-gui"

[[bin]]
name = "mmlfold-gui"
path = "src/main.rs"

[[bin]]
name = "mmlfold"
path = "src/bin/cli.rs"

[dependencies]
anyhow = "1"
eframe = "0.31"
cpal = "0.15.3"
rustysynth = "1.3.6"
midly = { version = "0.5.3", default-features = false, features = ["std", "strict"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
rfd = "0.15"
clap = { version = "4", features = ["derive"] }
rayon = "1.12"

[target.'cfg(target_arch = "wasm32")'.dependencies]
cpal = { version = "0.15.3", features = ["wasm-bindgen"] }
serde = { version = "1", features = ["derive"] }
serde-wasm-bindgen = "0.6"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
futures-channel = "0.3"
js-sys = "0.3"
console_error_panic_hook = "0.1"
zip = { version = "2.4", default-features = false }
web-sys = { version = "0.3", features = ["Window", "Document", "Element", "Node", "Event", "EventTarget", "HtmlCanvasElement", "HtmlAnchorElement", "HtmlElement", "HtmlInputElement", "File", "FileList", "Blob", "BlobPropertyBag", "Url", "Worker", "WorkerOptions", "WorkerType", "MessageEvent", "ErrorEvent", "Response", "Request", "RequestInit", "RequestCache", "Location", "Performance", "AudioContext", "console"] }

[build-dependencies]
ico = "0.5"
resvg = { version = "0.48.1", default-features = false }
winresource = "0.1.31"

[dev-dependencies]
serde_json = "1"

[profile.release]
lto = "thin"
strip = true
