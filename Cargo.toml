[package]
name = "mmlfold"
version = "0.1.0"
license = "MIT"
edition = "2024"
description = "MabiIcco score folding and scroll splitting with a native desktop GUI"
default-run = "mmlfold-gui"

[[bin]]
name = "mmlfold-gui"
path = "src/main.rs"

[[bin]]
name = "mmlfold"
path = "src/bin/cli.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
eframe = "0.31"
rfd = "0.15"
cpal = "0.15.3"
rustysynth = "1.3.6"
midly = { version = "0.5.3", default-features = false, features = ["std", "strict"] }
rayon = "1.12"

[build-dependencies]
ico = "0.5"
resvg = { version = "0.48.1", default-features = false }
winresource = "0.1.31"

[dev-dependencies]
serde_json = "1"

[profile.release]
lto = "thin"
strip = true
